name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_DEBUG: false
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install Composer dependencies (including dev)
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Prepare storage directories
        run: |
          mkdir -p storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs bootstrap/cache
          chmod -R 775 storage bootstrap/cache

      - name: Set test application key
        run: echo "APP_KEY=base64:$(php -r 'echo base64_encode(random_bytes(32));')" >> $GITHUB_ENV

      - name: Run PHP tests
        run: php artisan test --compact

  deploy:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/home/charisme/elhadar_hrms' }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, mysql
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Production Composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies & Build Frontend
        run: |
          npm install
          npm run build

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts and configure SSH multiplexing
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p $DEPLOY_PORT -H $DEPLOY_HOST >> ~/.ssh/known_hosts
          cat << 'EOF' > ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 10m
            ServerAliveInterval 15
            ServerAliveCountMax 3
            ConnectTimeout 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy via rsync over SSH
        run: |
          # Rsync application to server.
          # Crucial exclusions to prevent data loss:
          #   - .env* (preserve live production database credentials & app key)
          #   - storage/ (preserve uploaded documents, photos, logs, sessions)
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env*' \
            --exclude='storage' \
            --exclude='node_modules' \
            --exclude='tests' \
            -e "ssh -p $DEPLOY_PORT" \
            ./ $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH

      - name: Run artisan commands on server
        run: |
          ssh -T -p $DEPLOY_PORT $DEPLOY_USER@$DEPLOY_HOST <<EOF
            set -e
            cd $DEPLOY_PATH

            # Run migrations on production database
            php artisan migrate --force

            # Ingest terminated personnel dataset
            php artisan hrms:import-terminated-employees --no-interaction || true

            # Ingest annual leave ledger
            php artisan hrms:import-annual-leave --no-interaction || true

            # Clear stale caches
            php artisan config:clear
            php artisan cache:clear
            php artisan view:clear

            # Ensure storage symlink exists
            [ -L public/storage ] || php artisan storage:link || true

            # Cache config, routes, and views for production performance
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Ensure correct web server permissions on new Vite assets
            chmod -R 755 public/build
            find public/build -type f -exec chmod 644 {} +

            # Force LiteSpeed to reload PHP workers and flush OPcache
            touch public/index.php
            pkill -u $DEPLOY_USER lsphp || true

            # Verify application status
            php artisan about
          EOF

      - name: Purge Cloudflare Cache
        if: env.CLOUDFLARE_ZONE_ID != '' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Purging Cloudflare cache..."
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' || true

      - name: Post-deploy health check
        run: |
          TARGET_URL="https://www.charismahand.com/"
          echo "Checking health at $TARGET_URL ..."
          for i in {1..10}; do
            HTTP_CODE=$(curl -m 10 -k -o /dev/null -s -w "%{http_code}" -L "$TARGET_URL" || true)
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "✅ Application healthy (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "⏳ Waiting for response (HTTP $HTTP_CODE), retry ${i}/10..."
            sleep 6
          done
          echo "⚠️ External health check returned HTTP $HTTP_CODE. Verifying via SSH..."
          ssh -T -p $DEPLOY_PORT $DEPLOY_USER@$DEPLOY_HOST "cd $DEPLOY_PATH && php artisan route:list --path=login"